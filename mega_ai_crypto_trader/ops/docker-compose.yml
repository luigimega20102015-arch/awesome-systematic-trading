name: mega-crypto-paper
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /freqtrade
    environment:
      HOME: /freqtrade
    volumes:
      - ../user_data:/freqtrade/user_data
      - ../binance_dryrun.json:/freqtrade/config_paper.json:ro
      - ./paper_guard.py:/freqtrade/paper_guard.py:ro
    entrypoint: ["python", "/freqtrade/paper_guard.py"]
    command: ["trade", "--config", "/freqtrade/config_paper.json", "--strategy", "MegaBaselinePaper", "--db-url", "sqlite:////freqtrade/user_data/trades_paper.sqlite"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # API disabled, no exposed ports, no credentials
